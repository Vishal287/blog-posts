<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Title -->
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="96" font-size="22" font-weight="600" fill="#8b98b8" letter-spacing="3">GCP LOGS  ·  CLAUDE CODE  ·  CODEBASE</text>
    <text x="72" y="168" font-size="58" font-weight="800" fill="#f2f4f8">From error logs to a fix,</text>
    <text x="72" y="236" font-size="58" font-weight="800" fill="#f2f4f8">in one click</text>
    <rect x="72" y="262" width="150" height="6" rx="3" fill="url(#accent)"/>
  </g>

  <!-- Log panel -->
  <g transform="translate(72,312)">
    <rect width="560" height="260" rx="14" fill="#0a0e16" stroke="#2a3350"/>
    <circle cx="26" cy="24" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="24" r="6" fill="#febc2e"/>
    <circle cx="66" cy="24" r="6" fill="#28c840"/>
    <text x="92" y="29" font-family="Menlo, Consolas, monospace" font-size="14" fill="#6b7896">logs · last 1h</text>
    <g font-family="Menlo, Consolas, monospace" font-size="16">
      <text x="24" y="76"  fill="#6b7896">10:42:01 <tspan fill="#7ee787">INFO </tspan> <tspan fill="#a8b3cf">GET /api/orders 200</tspan></text>
      <rect x="14" y="92" width="532" height="30" rx="6" fill="#ff5f57" fill-opacity="0.12"/>
      <text x="24" y="113" fill="#6b7896">10:42:07 <tspan fill="#ff7b72">ERROR</tspan> <tspan fill="#f2f4f8">TypeError: undefined id</tspan></text>
      <text x="24" y="150" fill="#6b7896">10:42:09 <tspan fill="#7ee787">INFO </tspan> <tspan fill="#a8b3cf">ip=███.███.█.██ hdr=████</tspan></text>
      <rect x="14" y="166" width="532" height="30" rx="6" fill="#ff5f57" fill-opacity="0.12"/>
      <text x="24" y="187" fill="#6b7896">10:42:13 <tspan fill="#ff7b72">ERROR</tspan> <tspan fill="#f2f4f8">TypeError: undefined id</tspan></text>
      <text x="24" y="224" fill="#6b7896">10:42:20 <tspan fill="#e3b341">WARN </tspan> <tspan fill="#a8b3cf">retry 3/3 payment-svc</tspan></text>
    </g>
  </g>

  <!-- Arrow -->
  <g transform="translate(652,442)">
    <path d="M0 0H70" stroke="#d97757" stroke-width="4" stroke-linecap="round"/>
    <path d="M60 -12L76 0L60 12" fill="none" stroke="#d97757" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- RCA / Fix panel -->
  <g transform="translate(748,312)" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="380" height="260" rx="14" fill="#121a2c" stroke="#3a4a78"/>
    <text x="26" y="44" font-size="15" font-weight="700" fill="#8b98b8" letter-spacing="2">ROOT CAUSE</text>
    <text x="26" y="76" font-size="19" fill="#f2f4f8">Order id missing when the</text>
    <text x="26" y="102" font-size="19" fill="#f2f4f8">cart is empty</text>
    <g font-family="Menlo, Consolas, monospace" font-size="15">
      <rect x="26" y="124" width="328" height="56" rx="8" fill="#0a0e16"/>
      <text x="40" y="147" fill="#ff7b72">- const id = cart.id</text>
      <text x="40" y="169" fill="#7ee787">+ const id = cart?.id ?? null</text>
    </g>
    <rect x="26" y="200" width="120" height="40" rx="9" fill="#d97757"/>
    <text x="86" y="226" font-size="17" font-weight="700" fill="#1a0f0a" text-anchor="middle">Fix</text>
    <text x="162" y="226" font-size="16" fill="#8b98b8">45 min → 15 min</text>
  </g>
</svg>
