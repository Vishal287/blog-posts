name: Build blog index

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: dependency install scripts can't run while the write token is available.
      - run: npm ci --ignore-scripts

      - run: npm run build:index

      # No loop: the commit only touches index.json (outside the posts/** filter),
      # and pushes made with GITHUB_TOKEN never start new workflow runs.
      - name: Commit index.json and html/ if they changed
        run: |
          # Stage first: plain "git diff" ignores new, untracked HTML files.
          git add -A -- index.json html
          if git diff --cached --quiet; then
            echo "index.json and html/ unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update blog index and html"
          git push
