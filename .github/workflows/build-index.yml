name: Build blog index

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs: a tag can be moved to new code, a commit can't.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: dependency install scripts can't run while the write token is available.
      - run: npm ci --ignore-scripts

      - run: npm run build:index

      # No loop: pushes made with GITHUB_TOKEN never start new workflow runs.
      - name: Commit index.json and html/ if they changed
        run: |
          # Stage first: plain "git diff" ignores new, untracked HTML files.
          git add -A -- index.json html
          if git diff --cached --quiet; then
            echo "index.json and html/ unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update blog index and html"
          git push
